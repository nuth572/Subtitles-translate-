<!doctype html>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #06060f;
    color: #e2e8f0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .box { text-align: center; }
  .logo {
    width: 72px; height: 72px;
    margin: 0 auto 1.25rem;
    border-radius: 22px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
    font-family: 'Kantumruy Pro', 'Noto Sans Khmer', sans-serif;
    font-weight: 700; font-size: 2.25rem; color: #fff;

  p { color: #94a3b8; font-size: 0.9375rem; margin: 0 0 1.5rem; }
  a.btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    background: linear-gradient(90deg, #ec4899, #8b5cf6, #06b6d4);
    color: #fff; text-decoration: none; font-weight: 700; font-size: 0.9375rem;
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.35);
  }
  a.btn:hover { filter: brightness(1.12); }
  .spinner {
    display: inline-block; width: 1.1em; height: 1.1em;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -0.15em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

<link rel="preconnect" href="https://fonts.googleapis.com" />
